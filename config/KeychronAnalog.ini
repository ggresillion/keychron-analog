; Keychron HE analog shim (wooting_analog_sdk.dll) - optional settings.
; Place next to wooting_analog_sdk.dll. Log: KeychronAnalog.log in the same folder.
[General]
; Only poll the keyboard while the game window has focus.
PollOnlyWhenFocused = 1
; Extra delay between polling sweeps in microseconds (0 = as fast as possible, ~110 Hz for 4 keys).
ExtraPollDelayUs = 0
; Log every non-zero key reading (debug only, very verbose).
LogRaw = 0
; Keychron product IDs to look for (K2 HE ANSI/ISO/JIS; only ANSI 0x0E20 is tested).
ProductIds = 0x0E20, 0x0E21, 0x0E22

; Keys to read: row, col, HID usage, scan code (set 1), US virtual key, name.
; Default (no entries) = W A S D on the K2 HE ANSI matrix. Example:
;[Keys]
;Key1 = 2, 2, 0x1A, 0x11, 0x57, W
;Key2 = 3, 1, 0x04, 0x1E, 0x41, A
;Key3 = 3, 2, 0x16, 0x1F, 0x53, S
;Key4 = 3, 3, 0x07, 0x20, 0x44, D
